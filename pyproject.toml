[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-unit-converter"
version = "0.1.0"
description = "A small MCP server that lets Claude convert length, weight, and temperature units."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-unit-converter = "unit_converter.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unit_converter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
